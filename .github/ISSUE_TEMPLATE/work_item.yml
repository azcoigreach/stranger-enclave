name: Feature or work item
description: Track planned work, acceptance criteria, and progress.
body:
  - type: textarea
    id: outcome
    attributes:
      label: Intended outcome
      description: Describe the behavior or milestone this work should deliver.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and dependencies
      description: Link related issues and identify constraints or exclusions.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria and validation
      description: Use checkboxes for deliverables, deterministic checks, and live acceptance evidence.
    validations:
      required: true
  - type: input
    id: release
    attributes:
      label: Target release
      placeholder: "0.1.1 or backlog"
