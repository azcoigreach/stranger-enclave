name: Publish release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run validate

  publish:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Package and publish this validated main commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node tools/check-version.js)
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving its tag and assets unchanged."
            exit 0
          fi
          tag_args=(--target "$GITHUB_SHA")
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            test "$(git rev-list -n 1 "$tag")" = "$GITHUB_SHA" || {
              echo "Existing $tag points to another commit; refusing to publish mismatched assets."
              exit 1
            }
            tag_args=(--verify-tag)
          fi
          archive="stranger-enclave-$version.zip"
          zip -j "$RUNNER_TEMP/$archive" ./*.js
          (cd "$RUNNER_TEMP" && sha256sum "$archive" > "$archive.sha256")
          gh release create "$tag" "$RUNNER_TEMP/$archive" "$RUNNER_TEMP/$archive.sha256" \
            "${tag_args[@]}" --title "Stranger Enclave $tag" \
            --notes-file "docs/releases/$version.md"
